org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# No JDK path is pinned here on purpose. This file is committed and a machine
# specific path would break every other machine, including CI. The build needs
# a JDK 21 Gradle daemon; point JAVA_HOME at one before invoking Gradle. The
# development machine's location is recorded in HANDOFF.md, not here.

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# No analytics of any kind, including the build tool's own. This app collects
# nothing and the thing that builds it does not either.
android.builder.sdkDownload=true
