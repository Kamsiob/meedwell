# Builds the release bundle and generates signed build provenance for the
# artifact using keyless attestation, so there is no key to manage and the
# artifact is tied to the exact workflow run, commit, and repository that
# produced it.
#
# IMPORTANT, read before changing the distribution steps.
#
# The GitHub release asset is NOT built here. It is the Google-signed universal
# APK downloaded from Play Console after the bundle has been uploaded and
# processed, published as the release asset by hand or by a later step. That is
# deliberate: Play App Signing holds the real signing key, so the Play install
# and the GitHub install share one signature and a user can move between them
# without uninstalling or losing data.
#
# Consequence: every release goes to Play first, then GitHub. The GitHub asset
# cannot exist before the bundle reaches Play.
#
# Never write anywhere that the two builds are signed differently, or that one
# must be uninstalled before installing the other. That was an older approach
# and it is superseded.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  bundle:
    name: Build bundle and attest
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run the full unit test suite
        run: ./gradlew test

      - name: Decode the upload keystore
        # The upload key, not the app signing key. Google holds the app signing
        # key under Play App Signing, so a lost upload key is recoverable.
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$UPLOAD_KEYSTORE_BASE64" ]; then
            echo "UPLOAD_KEYSTORE_BASE64 is not set. Add it as a repository secret."
            exit 1
          fi
          echo "$UPLOAD_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"

      - name: Build the signed bundle
        env:
          UPLOAD_KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: ./gradlew bundleRelease

      - name: Remove the keystore from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: "app/build/outputs/bundle/release/*.aab"

      - name: Upload the bundle for the Play upload step
        uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 30
