name: Bug report
description: Something in Meedwell does not work the way it says it does.
type: Bug
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Please do not include your Bandcamp credentials. Nothing about a bug report needs them.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, and what the app did.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered steps, starting from opening the app. If it happens only sometimes, say roughly how often.
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Meedwell version
      description: From the About screen.
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and Android version
      placeholder: Pixel 8, Android 15
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: How you are using Meedwell
      options:
        - Connected to Bandcamp
        - Local files only
        - Both
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Where you installed it from
      options:
        - Google Play
        - GitHub release
        - Built from source
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Screenshots help. If the app crashed, the crash sheet shows you the whole report before you send anything, and you can paste it here.
